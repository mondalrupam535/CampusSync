<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__base"></div>
    <div class="bg__streaks"></div>
  </div>

  <main class="card">

    <!-- Left: form -->
    <section class="form-panel">
      <div class="form-panel__inner">
        <!-- Logo Image Added -->
<div class="brand-header">
  <div class="logo-container">
    <img src="logo.jpg" alt="SRM AP Logo" class="custom-logo">
  </div>
  <span class="brand-name">CampusSync</span>
</div>

        <a class="back-link" href="../page1/index.html">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5l-5.5 5.5 5.5 5.5"/></svg>
          Setup overview
        </a>

        <div class="steps" aria-hidden="true">
          <span class="steps__bar is-on"></span>
          <span class="steps__bar"></span>
          <span class="steps__bar"></span>
        </div>
        <div class="eyebrow">STEP 1 OF 3</div>
        <h1 class="form-title">Personal profile</h1>
        <p class="form-desc">Some basic details so the right people can recognise and reach you.</p>

        <form id="profile-form" class="fields" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input class="input" id="name" name="name" type="text" placeholder="Your full name" autocomplete="name" required>
            <p class="field__error" id="name-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="email">College email</label>
            <input class="input" id="email" name="email" type="email" placeholder="you@srmap.edu.in" autocomplete="email" required>
            <p class="field__error" id="email-error" role="alert"></p>
          </div>

          <div class="row-2">
            <div class="field">
              <label for="username"><span>Username</span><span class="field__opt">Optional</span></label>
              <input class="input" id="username" name="username" type="text" placeholder="Pick a handle" autocomplete="username">
            </div>
            <div class="field">
              <label for="phone"><span>Phone number</span><span class="field__opt">Optional</span></label>
              <input class="input" id="phone" name="phone" type="tel" placeholder="+91" autocomplete="tel">
            </div>
          </div>

          <div class="upload">
            <div class="upload__avatar" id="avatar" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 26 26" fill="#a9c7bb"><circle cx="13" cy="9.5" r="4.5"/><path d="M4.5 22c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/></svg>
            </div>
            <div class="upload__text">
              <div class="upload__title">Profile photo <span>· Optional</span></div>
              <div class="upload__hint">Helps people recognise you.</div>
            </div>
            <input id="photo" type="file" accept="image/*" hidden>
            <button class="btn btn--small" type="button" id="upload-btn">Upload</button>
          </div>

          <div class="actions">
            <a class="btn btn--ghost" href="../page1/index.html">Back</a>
            <button class="btn btn--primary" type="submit">
              Save &amp; continue
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5l5.5 5.5-5.5 5.5"/></svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- Right: dark showcase panel with animations -->
    <aside class="showcase" aria-hidden="true">
      <span class="deco deco--a animate-float-slow"></span>
      <span class="deco deco--b animate-pulse"></span>
      <span class="deco deco--c animate-float-mid"></span>
      <span class="deco deco--d animate-float-slow"></span>
      <span class="deco deco--e animate-pulse"></span>
      <span class="deco deco--f animate-float-fast"></span>

      <div class="photo animate-float-mid">
        <svg width="100%" height="100%" viewBox="0 0 356 270" preserveAspectRatio="xMidYMid slice">
          <path d="M70 270C70 212 118 188 178 188C238 188 286 212 286 270Z" fill="#b9d0c6"/>
          <rect x="160" y="150" width="36" height="46" rx="14" fill="#d3b6a3"/>
          <circle cx="178" cy="122" r="50" fill="#e0c7b5"/>
          <path d="M126 118C126 80 150 62 180 62C212 62 232 84 230 120C214 104 196 98 178 98C158 98 140 104 126 118Z" fill="#6a5448"/>
        </svg>
        <span class="photo__chip photo__chip--1"></span>
        <span class="photo__chip photo__chip--2"></span>
      </div>

      <div class="glass animate-float-slow">
        <div class="glass__head">
          <div class="glass__badge"><strong>1</strong><small>OF 3</small></div>
          <span class="glass__rule"></span>
          <div>
            <div class="glass__title">Personal profile</div>
            <div class="glass__sub">SRM University-AP</div>
          </div>
        </div>

        <div class="bars">
          <span class="bar bar--on"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>

        <div class="track">
          <span class="track__line"></span>
          <span class="track__line track__line--on"></span>
          <span class="node node--on node--1"></span>
          <span class="node node--on node--2"></span>
          <span class="node node--3"></span>
          <span class="node node--4"></span>
        </div>

        <div class="labels">
          <div class="label label--1"><b>Profile</b><span>Contact</span></div>
          <div class="label label--2"><b>Role</b><span>Department</span></div>
          <div class="label label--3"><b>Details</b><span>Category</span></div>
          <div class="label label--4"><b>Done</b><span>Ready</span></div>
        </div>
      </div>
    </aside>

  </main>

  <script src="../../dashboard/api-client.js"></script>
  <script>window.CampusSyncAPI.bootstrapPage(['personal.js'], []);</script>
</body>
</html>
