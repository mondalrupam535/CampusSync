<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Role and department</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../page2/form.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__base"></div>
    <div class="bg__streaks"></div>
  </div>

  <main class="card">

    <!-- Left: form -->
    <section class="form-panel">
      <div class="form-panel__inner">
        <!-- Logo Image Added -->
<div class="brand-header">
  <div class="logo-container">
    <img src="logo.jpg" alt="SRM AP Logo" class="custom-logo">
  </div>
  <span class="brand-name">CampusSync</span>
</div>

        <a class="back-link" href="../page1/index.html">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5l-5.5 5.5 5.5 5.5"/></svg>
          Setup overview
        </a>

        <div class="steps" aria-hidden="true">
          <span class="steps__bar is-on"></span>
          <span class="steps__bar is-on"></span>
          <span class="steps__bar"></span>
        </div>
        <div class="eyebrow">STEP 2 OF 3</div>
        <h1 class="form-title">Role &amp; department</h1>
        <p class="form-desc">Let us know who you are at SRM AP. Students also choose their specialization here.</p>

        <form id="role-form" class="fields" novalidate>
          <div class="field">
            <div class="field__label" id="cat-label">I am a</div>
            <div class="segmented" role="group" aria-labelledby="cat-label" id="category">
              <button type="button" data-value="student" aria-pressed="true">Student</button>
              <button type="button" data-value="faculty" aria-pressed="false">Faculty</button>
              <button type="button" data-value="staff" aria-pressed="false">Admin staff</button>
            </div>
          </div>

          <div class="field">
            <label for="dept">Department / unit</label>
            <div class="select-wrap">
              <select class="input is-placeholder" id="dept" name="dept" required>
                <option value="" selected>Select your department</option>
                
                <optgroup label="School of Engineering and Sciences (SEAS)">
                  <option value="Computer Science and Engineering">Computer Science and Engineering</option>
                  <option value="Electrical and Electronics Engineering">Electrical and Electronics Engineering</option>
                  <option value="Electronics and Communication Engineering">Electronics and Communication Engineering</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                  <option value="Civil Engineering">Civil Engineering</option>
                  <option value="Mathematics and Sciences">Mathematics and Sciences</option>
                </optgroup>

                <optgroup label="Easwari School of Liberal Arts (ESLA)">
                  <option value="English and Literature">English and Literature</option>
                  <option value="Psychology">Psychology</option>
                  <option value="Economics">Economics</option>
                  <option value="Political Science">Political Science</option>
                  <option value="Sociology">Sociology</option>
                  <option value="History">History</option>
                </optgroup>

                <optgroup label="Paari School of Business (PSB)">
                  <option value="Management">Management</option>
                  <option value="Commerce">Commerce</option>
                  <option value="Finance">Finance</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Operations and Analytics">Operations and Analytics</option>
                  <option value="Human Resources">Human Resources</option>
                </optgroup>

                <optgroup id="administrative-departments" label="Administrative Departments">
                  <option value="Admissions">Admissions</option>
                  <option value="Finance and Accounts">Finance and Accounts</option>
                  <option value="Human Resources (HR)">Human Resources (HR)</option>
                  <option value="Transport">Transport</option>
                  <option value="Campus Infrastructure and Maintenance">Campus Infrastructure and Maintenance</option>
                  <option value="Information Technology and Knowledge Management (ITKM)">Information Technology and Knowledge Management (ITKM)</option>
                  <option value="Student Affairs">Student Affairs</option>
                  <option value="Student Discipline and Hostels">Student Discipline and Hostels</option>
                  <option value="Corporate Relations and Career Services (CR&CS)">Corporate Relations and Career Services (CR&CS)</option>
                  <option value="International Relations and Higher Studies (IR&HS)">International Relations and Higher Studies (IR&HS)</option>
                  <option value="Communications">Communications</option>
                  <option value="Alumni Relations">Alumni Relations</option>
                  <option value="Sports">Sports</option>
                  <option value="Campus Life">Campus Life</option>
                  <option value="Research">Research</option>
                  <option value="Academic Affairs">Academic Affairs</option>
                  <option value="Examinations">Examinations</option>
                  <option value="Quality Assurance and Rankings (QAR)">Quality Assurance and Rankings (QAR)</option>
                  <option value="Library">Library</option>
                  <option value="Entrepreneurship and Innovation">Entrepreneurship and Innovation</option>
                  <option value="Teaching and Learning Centre (TLC)">Teaching and Learning Centre (TLC)</option>
                  <option value="Registrar's Office">Registrar's Office</option>
                  <option value="Facility Management">Facility Management</option>
                  <option value="Executive Education and Professional Studies (DEEPS)">Executive Education and Professional Studies (DEEPS)</option>
                  <option value="Technology Transfer Cell">Technology Transfer Cell</option>
                  <option value="Health and Wellness">Health and Wellness</option>
                  <option value="Security">Security</option>
                  <option value="Procurement and Stores">Procurement and Stores</option>
                  <option value="Legal and Compliance">Legal and Compliance</option>
                  <option value="General Administration">General Administration</option>
                </optgroup>
              </select>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5l5 5 5-5"/></svg>
            </div>
            <p class="field__error" id="dept-error" role="alert"></p>
          </div>

          <div class="field" id="student-specialization-field" hidden>
            <label for="student-specialization">Specialization</label>
            <div class="select-wrap">
              <select class="input is-placeholder" id="student-specialization" name="specialization" disabled>
                <option value="" selected>Select department first</option>
              </select>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5l5 5 5-5"/></svg>
            </div>
            <p class="field__error" id="student-specialization-error" role="alert"></p>
          </div>

          <div class="field" id="designation-field" hidden>
            <label for="designation">Designation / post</label>
            <div class="select-wrap">
              <select class="input is-placeholder" id="designation" name="designation" disabled>
                <option value="" selected>Select department first</option>
              </select>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5l5 5 5-5"/></svg>
            </div>
            <p class="field__error" id="designation-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="joining">Joining year</label>
            <input class="input" id="joining" name="joining" type="text" inputmode="numeric" maxlength="4" placeholder="e.g. 2025" required>
            <p class="field__error" id="joining-error" role="alert"></p>
          </div>

          <div class="actions">
            <a class="btn btn--ghost" href="../page2/index.html">Back</a>
            <button class="btn btn--primary" type="submit">
              Save &amp; continue
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5l5.5 5.5-5.5 5.5"/></svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- Right: dark showcase panel with animations -->
    <aside class="showcase" aria-hidden="true">
      <span class="deco deco--a animate-float-slow"></span>
      <span class="deco deco--b animate-pulse"></span>
      <span class="deco deco--c animate-float-mid"></span>
      <span class="deco deco--d animate-float-slow"></span>
      <span class="deco deco--e animate-pulse"></span>
      <span class="deco deco--f animate-float-fast"></span>

      <div class="photo animate-float-mid">
        <svg width="100%" height="100%" viewBox="0 0 356 270" preserveAspectRatio="xMidYMid slice">
          <path d="M70 270C70 212 118 188 178 188C238 188 286 212 286 270Z" fill="#b9d0c6"/>
          <rect x="160" y="150" width="36" height="46" rx="14" fill="#d3b6a3"/>
          <circle cx="178" cy="122" r="50" fill="#e0c7b5"/>
          <path d="M126 118C126 80 150 62 180 62C212 62 232 84 230 120C214 104 196 98 178 98C158 98 140 104 126 118Z" fill="#6a5448"/>
        </svg>
        <span class="photo__chip photo__chip--1"></span>
        <span class="photo__chip photo__chip--2"></span>
      </div>

      <div class="glass animate-float-slow">
        <div class="glass__head">
          <div class="glass__badge"><strong>2</strong><small>OF 3</small></div>
          <span class="glass__rule"></span>
          <div>
            <div class="glass__title">Role &amp; department</div>
            <div class="glass__sub">SRM University-AP</div>
          </div>
        </div>

        <div class="bars">
          <span class="bar bar--on"></span>
          <span class="bar bar--on"></span>
          <span class="bar"></span>
        </div>

        <div class="track">
          <span class="track__line"></span>
          <span class="track__line track__line--on track__line--two"></span>
          <span class="node node--on node--1"></span>
          <span class="node node--on node--2"></span>
          <span class="node node--on node--3"></span>
          <span class="node node--4"></span>
        </div>

        <div class="labels">
          <div class="label label--1"><b>Profile</b><span>Contact</span></div>
          <div class="label label--2"><b>Role</b><span>Department</span></div>
          <div class="label label--3"><b>Details</b><span>Category</span></div>
          <div class="label label--4"><b>Done</b><span>Ready</span></div>
        </div>
      </div>
    </aside>

  </main>

  <script src="../../dashboard/api-client.js"></script>
  <script>window.CampusSyncAPI.bootstrapPage(['../page4/student-catalog.js', 'role.js'], []);</script>
</body>
</html>
